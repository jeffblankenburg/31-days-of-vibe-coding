name: Daily Rebuild

on:
  schedule:
    # Run at 5:00 AM UTC (midnight Eastern)
    - cron: '0 5 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update timestamp to trigger rebuild
        run: |
          echo "Last rebuild: $(date -u)" > .last-rebuild
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-rebuild
          git commit -m "Daily rebuild $(date -u +%Y-%m-%d)"
          git push
